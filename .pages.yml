media:
  input: images
  output: images

content:
  - name: site_content
    label: Konten & Foto Website
    type: file
    path: content.json
    fields:
      - name: hero_title
        label: Judul Utama (Hero)
        type: string
      - name: hero_subtitle
        label: Deskripsi Hero
        type: text
      - name: hero_image
        label: Foto Utama (Hero)
        type: image
      - name: rooms
        label: Daftar Kamar & Harga
        type: object
        list: true
        fields:
          - name: id
            label: ID Kamar (jangan diubah)
            type: string
          - name: name
            label: Nama Kamar
            type: string
          - name: tag
            label: Label View
            type: string
          - name: rate
            label: Harga per Malam (USD)
            type: number
          - name: desc
            label: Deskripsi Kamar
            type: text
          - name: main_image
            label: Foto Utama Kamar
            type: image
      - name: offers
        label: Foto Promo & Gathering
        type: object
        fields:
          - name: offer_stay
            label: Foto Stay 3 Nights Pay 2
            type: image
          - name: offer_spa
            label: Foto Wellness Escape (Spa)
            type: image
          - name: offer_dining
            label: Foto Sunset Dinner
            type: image
          - name: event_wedding
            label: Foto Weddings
            type: image
          - name: event_meeting
            label: Foto Meetings & Events
            type: image
          - name: footer_map
            label: Foto Peta Footer
            type: image
            - name: spa
        label: Spa & Wellness
        type: object
        fields:
          - name: title
            label: Judul Bagian Spa
            type: string
          - name: subtitle
            label: Deskripsi Spa
            type: text
          - name: hours
            label: Jam Operasional
            type: string
          - name: hero_image
            label: Foto Utama Spa
            type: image
          - name: treatments
            label: Daftar Perawatan (Treatments)
            type: object
            list: true
            fields:
              - name: name
                label: Nama Perawatan
                type: string
              - name: duration
                label: Durasi
                type: string
              - name: price
                label: Harga
                type: string
              - name: description
                label: Deskripsi Singkat
                type: text
              - name: image
                label: Foto Perawatan
                type: image

      - name: dining
        label: Dining & Culinary
        type: object
        fields:
          - name: title
            label: Judul Bagian Dining
            type: string
          - name: subtitle
            label: Deskripsi Restoran
            type: text
          - name: hours
            label: Jam Operasional
            type: string
          - name: hero_image
            label: Foto Utama Restoran
            type: image
          - name: items
            label: Menu Unggulan (Signature Dishes)
            type: object
            list: true
            fields:
              - name: name
                label: Nama Menu
                type: string
              - name: category
                label: Kategori (misal: Signature, Seafood, Cocktail)
                type: string
              - name: price
                label: Harga
                type: string
              - name: description
                label: Deskripsi Hidangan
                type: text
              - name: image
                label: Foto Menu
                type: image

      - name: reviews
        label: Guest Reviews (Testimoni)
        type: object
        list: true
        fields:
          - name: guest_name
            label: Nama Tamu
            type: string
          - name: origin
            label: Asal / Kategori Tamu
            type: string
          - name: rating
            label: Rating Bintang (1-5)
            type: number
          - name: quote
            label: Isi Ulasan
            type: text
          - name: date
            label: Bulan / Tahun Kunjungan
            type: string
