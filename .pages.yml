media:
  input: images
  output: /images

content:
  - name: site_content
    label: Konten & Foto Website
    type: file
    path: content.json
    fields:
      - name: hero_title
        label: Hero Title
        type: string
      - name: hero_subtitle
        label: Hero Subtitle
        type: text
      - name: hero_image
        label: Hero Background Image
        type: image

      - name: rooms
        label: Sanctuaries & Rooms
        type: object
        list: true
        fields:
          - name: id
            label: Room ID (deluxe / villa / family)
            type: string
          - name: name
            label: Room Name
            type: string
          - name: tag
            label: Badge Tag
            type: string
          - name: rate
            label: Nightly Rate (USD)
            type: number
          - name: size
            label: Room Size
            type: string
          - name: bed
            label: Bed Configuration
            type: string
          - name: guests
            label: Max Guests
            type: string
          - name: feature
            label: Highlight Feature
            type: string
          - name: desc
            label: Description
            type: text
          - name: main_image
            label: Main Photo
            type: image
          - name: bath_image
            label: Bathroom Photo (Deluxe)
            type: image
          - name: terrace_image
            label: Terrace Photo (Deluxe)
            type: image

      - name: offers
        label: Offers & Gatherings
        type: object
        fields:
          - name: offer_stay
            label: Stay Longer Image
            type: image
          - name: offer_spa
            label: Wellness Offer Image
            type: image
          - name: offer_dining
            label: Sunset Dinner Image
            type: image
          - name: event_wedding
            label: Weddings Image
            type: image
          - name: event_meeting
            label: Meetings & Events Image
            type: image
          - name: footer_map
            label: Footer Map Image
            type: image

      - name: spa
        label: Spa & Wellness
        type: object
        fields:
          - name: hours
            label: Jam Buka Spa
            type: string
          - name: title
            label: Judul Utama Spa
            type: string
          - name: subtitle
            label: Subjudul Spa
            type: text
          - name: treatments
            label: Daftar Perawatan Spa
            type: object
            list: true
            fields:
              - name: name
                label: Nama Perawatan
                type: string
              - name: duration
                label: Durasi (cth. 90 Minutes)
                type: string
              - name: category
                label: Kategori (cth. Full Body)
                type: string
              - name: price
                label: Harga (cth. $75)
                type: string
              - name: desc
                label: Deskripsi
                type: text
              - name: perk
                label: Fasilitas Tambahan
                type: string

      - name: dining
        label: Dining (The Teak Terrace)
        type: object
        fields:
          - name: hours
            label: Jam Buka Restoran
            type: string
          - name: title
            label: Judul Utama Dining
            type: string
          - name: subtitle
            label: Subjudul Dining
            type: text
          - name: tasting
            label: Menu 1 - Sunset Tasting
            type: object
            list: true
            fields:
              - name: tag
                label: Label Course (cth. Course I • Amuse)
                type: string
              - name: name
                label: Nama Hidangan
                type: string
              - name: price
                label: Harga (cth. $18)
                type: string
              - name: img
                label: Foto Hidangan
                type: image
              - name: desc
                label: Deskripsi Hidangan
                type: text
          - name: coastal
            label: Menu 2 - All-Day Mains
            type: object
            list: true
            fields:
              - name: tag
                label: Label Kategori
                type: string
              - name: name
                label: Nama Hidangan
                type: string
              - name: price
                label: Harga
                type: string
              - name: img
                label: Foto Hidangan
                type: image
              - name: desc
                label: Deskripsi Hidangan
                type: text
          - name: morning
            label: Menu 3 - Morning Terrace
            type: object
            list: true
            fields:
              - name: tag
                label: Jam Sajian
                type: string
              - name: name
                label: Nama Hidangan
                type: string
              - name: price
                label: Harga
                type: string
              - name: img
                label: Foto Hidangan
                type: image
              - name: desc
                label: Deskripsi Hidangan
                type: text
          - name: drinks
            label: Menu 4 - Botanical Bar
            type: object
            list: true
            fields:
              - name: tag
                label: Kategori Minuman
                type: string
              - name: name
                label: Nama Minuman
                type: string
              - name: price
                label: Harga
                type: string
              - name: img
                label: Foto Minuman
                type: image
              - name: desc
                label: Deskripsi Minuman
                type: text

      - name: reviews
        label: Guest Reviews
        type: object
        list: true
        fields:
          - name: quote
            label: Kutipan Testimoni
            type: text
          - name: author
            label: Nama Tamu
            type: string
          - name: country
            label: Negara Asal
            type: string

      - name: contact
        label: Concierge & Footer Contact
        type: object
        fields:
          - name: whatsapp
            label: Nomor WhatsApp (cth. 6281234567890)
            type: string
          - name: email
            label: Email Support
            type: string
          - name: phone
            label: Nomor Telepon
            type: string
          - name: address
            label: Alamat Resort
            type: string
          - name: checkin_note
            label: Info Check-in
            type: string
